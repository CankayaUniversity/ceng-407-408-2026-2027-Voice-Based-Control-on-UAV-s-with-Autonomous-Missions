name: "Task"
description: "Create a concrete engineering, testing, or implementation step."
title: "[TASK]: "
labels: ["Tasks"]
projects: ["CankayaUniversity/31"]
body:
  - type: input
    id: parent_req
    attributes:
      label: Parent Requirement
      description: Which Requirement does this task fulfill? (e.g., #12)
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: task_details
    attributes:
      label: Implementation Details
      description: What exactly needs to be built? (API endpoint, DB schema, UI component, etc.)
    validations:
      required: true
  - type: dropdown
    id: story_points
    attributes:
      label: Estimated Story Points
      description: Estimated effort using the Fibonacci sequence.
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
        - "13"
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done (DoD)
      description: Conditions that must be met before submitting a PR.
      placeholder: |
        - [ ] Code is written and formatted
        - [ ] Unit tests are passing
    validations:
      required: false