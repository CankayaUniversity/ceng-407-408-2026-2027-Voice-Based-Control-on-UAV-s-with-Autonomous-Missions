name: "Requirement"
description: "Define a verifiable system-level or functional requirement."
title: "[REQ]: "
labels: ["Requirements"]
projects: ["CankayaUniversity/31"]
body:
  - type: input
    id: parent_epic
    attributes:
      label: Parent Epic
      description: Which Epic does this requirement belong to? (e.g., #5)
      placeholder: "#5"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Requirement Details
      description: What must the system do? (e.g., Paste REQ-CORE-001 to 005 here).
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: How will we verify that this requirement is successfully met?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: initial_tasks
    attributes:
      label: Child Tasks
      description: Draft the list of tasks needed to complete this requirement. You can use GitHub's "Convert to issue" button later.
      placeholder: |
        - [ ] Task 1
        - [ ] Task 2
    validations:
      required: false