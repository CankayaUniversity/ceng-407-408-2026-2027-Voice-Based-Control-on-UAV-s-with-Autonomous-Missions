name: Linking PR with an Issue

on:
  pull_request:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: read

jobs:
  link-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Link PR and Issue
        uses: actions/github-script@v7
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            
            if (baseBranch.endsWith('/master')) {
              const prBody = context.payload.pull_request.body || "";
              const prUrl = context.payload.pull_request.html_url;
              const prNumber = context.payload.pull_request.number;
              
              const regex = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved):?\s+#(\d+)\b/gi;
              let match;
              const issueNumbers = [];
              
              while ((match = regex.exec(prBody)) !== null) {
                issueNumbers.push(parseInt(match[1], 10));
              }
              
              const uniqueIssues = [...new Set(issueNumbers)];
              
              for (const issueNumber of uniqueIssues) {
                try {
                  const comments = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    per_page: 100
                  });
                  
                  const commentIdentifier = `<!-- linked-by-pr-${prNumber} -->`;
                  const alreadyLinked = comments.data.some(c => c.body && c.body.includes(commentIdentifier));
                  
                  if (!alreadyLinked) {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      body: `${commentIdentifier} **Linked PR:** This issue has been linked with PR [#${prNumber}](${prUrl}). When this PR is merged into **${baseBranch}**, this issue will be closed automatically.`
                    });
                    console.log(`Link comment added successfully to issue #${issueNumber}.`);
                  }
                } catch (error) {
                  console.error(`Failed to link issue #${issueNumber}:`, error.message);
                }
              }
            }
