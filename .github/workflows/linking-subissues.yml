name: Auto Link Sub-issues

on:
  issues:
    types: [opened]

jobs:
  link-to-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Parent Issue ID
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            
            const match = body.match(/(?:Parent Epic|Parent Requirement)[\s\S]*?(?:#)(\d+)/i);
            
            if (match && match[1]) {
              console.log(`Parent Issue found: #${match[1]}`);
              core.setOutput('parent_number', match[1]);
              core.setOutput('has_parent', 'true');
            } else {
              console.log("Parent reference not found. Skipping.");
              core.setOutput('has_parent', 'false');
            }

      - name: Link as Sub-issue via GraphQL API
        if: steps.extract.outputs.has_parent == 'true'
        uses: actions/github-script@v7
        env:
          PARENT_NUMBER: ${{ steps.extract.outputs.parent_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const childNumber = context.payload.issue.number;
            const parentNumber = parseInt(process.env.PARENT_NUMBER, 10);
            
            console.log(`Linking Child Issue #${childNumber} -> Parent Issue #${parentNumber}...`);

            const query = `
              query($owner: String!, $repo: String!, $child: Int!, $parent: Int!) {
                repository(owner: $owner, name: $repo) {
                  childIssue: issue(number: $child) { id }
                  parentIssue: issue(number: $parent) { id }
                }
              }
            `;
            
            const variables = {
              owner: repoOwner,
              repo: repoName,
              child: childNumber,
              parent: parentNumber
            };

            const result = await github.graphql(query, variables);
            
            const childNodeId = result.repository.childIssue.id;
            const parentNodeId = result.repository.parentIssue.id;
            
            const mutation = `
              mutation($parent: ID!, $child: ID!) {
                addSubIssue(input: {issueId: $parent, subIssueId: $child}) {
                  issue {
                    id
                  }
                }
              }
            `;
            
            try {
              await github.graphql(mutation, {
                parent: parentNodeId,
                child: childNodeId
              });
              console.log("Successfully linked as a sub-issue");
            } catch (error) {
              console.error("Linking failed:", error.message);
              core.setFailed(error.message);
            }