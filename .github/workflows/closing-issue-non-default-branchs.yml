name: Auto Close Issue on Non-Default Branch Merge

on:
  pull_request:
    types: [closed]

permissions: 
  issues: write
  pull-requests: read

jobs:
  close-linked-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Branch and Issue Check
        uses: actions/github-script@v7
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            
            if (baseBranch.endsWith('/master')) {
              const prBody = context.payload.pull_request.body || "";
              const prNumber = context.payload.pull_request.number;
              const regex = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved):?\s+#(\d+)\b/gi;
              let match;
              const issueNumbers = [];
              
              while ((match = regex.exec(prBody)) !== null) {
                issueNumbers.push(parseInt(match[1], 10));
              }
              
              const uniqueIssues = [...new Set(issueNumbers)];
              
              if (uniqueIssues.length === 0) {
                console.log("No issue closing keywords found in PR description.");
                return;
              }
              
              for (const issueNumber of uniqueIssues) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    state: 'closed',
                    state_reason: 'completed'
                  });
                  
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: `This issue was closed automatically by PR #${prNumber} upon merging into **${baseBranch}**.`
                  });
                  
                  console.log(`Issue #${issueNumber} closed successfully.`);
                } catch (error) {
                  console.error(`Failed to close issue #${issueNumber}:`, error.message);
                }
              }
            } else {
              console.log(`Target branch (${baseBranch}) is not a subteam master branch.`);
            }
